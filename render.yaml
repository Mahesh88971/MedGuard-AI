services:
  - type: web
    name: medguard-ai
    runtime: python
    plan: starter
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    disk:
      name: medguard-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MEDGUARD_DB
        value: /var/data/medguard.sqlite3
      - key: MEDGUARD_UPLOAD_DIR
        value: /var/data/private_uploads
      - key: MEDGUARD_COOKIE_SECURE
        value: "1"
